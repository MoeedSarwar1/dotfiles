# ============================================
# TPM Plugin Manager
# ============================================
# Set custom plugin directory
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/dotfiles/tmux/plugins/'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# ============================================
# Core Settings
# ============================================
# Enable mouse support
set -g mouse on

# Increase history limit
set -g history-limit 10000

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Automatically rename windows based on running program
set-window-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_command}'

# Allow manual window renaming to persist
set-option -g allow-rename off

# Enable true color support
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"   # covers xterm-ghostty and xterm-256color

# Faster command sequences (no delay for escape key)
set -sg escape-time 0

# Allow passthrough for image rendering
set -qg allow-passthrough on

# Extended keys: nvim can tell Tab from C-i and Enter from C-m
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features ",xterm*:extkeys"

# Copy to the macOS clipboard via OSC 52 (works in Ghostty, also over SSH)
set -s set-clipboard on

# Closing the last window of a session switches to another session instead of detaching
set -g detach-on-destroy off

# ============================================
# Key Bindings - Prefix
# ============================================
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config easily
bind r source-file ~/.config/dotfiles/tmux/tmux.conf \; display-message "✓ Config reloaded!"

# Install plugins command with feedback
bind I run-shell "~/.config/dotfiles/tmux/plugins/tpm/bindings/install_plugins" \; display-message "✓ Plugins installed!"

# ============================================
# Key Bindings - Pane Navigation (Vim-style)
# ============================================
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ============================================
# Key Bindings - Pane Management
# ============================================
# Split panes using | and - (more intuitive)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Resize panes with capital vim keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ============================================
# Key Bindings - Window Management
# ============================================
# Create new window in current path
bind c new-window -c "#{pane_current_path}"

# ============================================
# Plugins - Session & State Management
# ============================================
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'

set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# ============================================
# Plugins - Productivity & Navigation
# ============================================
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @yank_selection_mouse 'clipboard'

set -g @plugin 'tmux-plugins/tmux-open'

# Projects: prefix + f opens any project as a session (editor / shell / metro)
bind f display-popup -E -w 70% -h 50% "~/.config/dotfiles/bin/tmux-sessionizer"

# Open sessions: prefix + C-f fuzzy-switches between running sessions/windows
set -g @plugin 'vndmp4/tmux-fzf-session-switch'
set -g @fzf-goto-preview-enabled 'true'
set -g @fzf-goto-win-width 70
set -g @fzf-goto-win-height 20


# Vim tmux navigator: C-h/j/k/l moves across nvim splits and tmux panes
# (prefix + C-l clears the screen, since C-l itself now navigates)
set -g @plugin 'christoomey/vim-tmux-navigator'

# ============================================
# Plugins - System Monitoring
# ============================================
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @cpu_low_icon "="
set -g @cpu_medium_icon "≡"
set -g @cpu_high_icon "≣"
set -g @cpu_low_fg_color "#[fg=green]"
set -g @cpu_medium_fg_color "#[fg=yellow]"
set -g @cpu_high_fg_color "#[fg=red]"
set -g @cpu_percentage_format "%3.0f%%"
set -g @ram_percentage_format "%3.0f%%"

# ============================================
# Plugins - Theme & Appearance
# ============================================
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'mocha'
set -g @plugin 'robhurring/tmux-spotify'

# Spotify configuration
set -g @spotify_playing_icon "♫"
set -g @spotify_paused_icon "❙❙"
set -g @spotify_stopped_icon "■"

# Status bar position
set -g status-position top
set -g status-interval 5

# Status bar styling
set -g status-right-length 150
set -g status-left-length 100


# Catppuccin theme customization
set -ogq @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_current_text " #{b:pane_current_path}"
set -g @catppuccin_window_current_format_directory_text " #{b:pane_current_path}"
set -ogq @catppuccin_window_current_number "#I"
set -ogq @catppuccin_window_text " #W"
set -ogq @catppuccin_window_number "#I"

set -g @catppuccin_date_time_text " %H:%M"

# Custom status bar with Spotify and System Monitoring
set -g status-justify left
set -g status-right "#{music_status} #{artist} - #{track} | CPU:#{cpu_percentage} RAM:#{ram_percentage} | #{E:@catppuccin_status_directory} | #{E:@catppuccin_status_date_time}"
set -g status-left "#{E:@catppuccin_status_session}"

# Pane border styling
set -g @catppuccin_pane_border_style "fg=#{@thm_surface_1}"
set -g @catppuccin_pane_active_border_style "fg=#{@thm_blue}"

# Window styling
set -g @catppuccin_window_number_position "right"

# Window status
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"

# Activity monitoring
set -g monitor-activity on
set -g visual-activity off

# ============================================
# Copy Mode (Vi-style)
# ============================================
setw -g mode-keys vi

# Enter copy mode with Prefix + v (easier than [)
bind v copy-mode


bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind x confirm-before -p "kill-pane #P? (y/n)" kill-pane

# ============================================
# Popups
# ============================================
# prefix + g: lazygit over the current pane, in its directory
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
# prefix + t: throwaway shell (exit to close)
bind t display-popup -E -w 80% -h 75% -d "#{pane_current_path}"

# ============================================
# Initialize TPM (keep at bottom)
# ============================================
# tmux-fingers (brew install tmux-fingers): prefix + F labels URLs, paths, hashes, IPs on screen; type a label to copy
run 'tmux-fingers load-config'

run '~/.config/dotfiles/tmux/plugins/tpm/tpm'
